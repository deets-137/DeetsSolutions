<!doctype html>
<html lang="en" data-theme="lilac" data-skin="cyber">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeetsMusic — Deets</title>
    <link rel="icon" href="../assets/favicon.png" type="image/png" />
    <script>
      (function () {
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          /* Retired ids → successor, both axes. Mirrors RETIRED in controls.js. */
          var R = { desk: "press", fairy: "lilac", glade: "green",
                    hornet: "black-yellow", viper: "black-red",
                    cyberstorm: "cyber", "retro-future": "cyber" };
          var t = localStorage.getItem("deets-theme");
          if (!t) { t = dark ? "moonlight" : "lilac"; }
          document.documentElement.setAttribute("data-theme", R[t] || t);
          var s = localStorage.getItem("deets-skin");
          if (!s) { s = dark ? "ocean" : "glass"; }
          document.documentElement.setAttribute("data-skin", R[s] || s);
        } catch (e) {}
      })();
    </script>
    <!-- ?v= on the assets this page's board logic depends on. `_headers` is
         meant to hold CSS/JS at max-age=0, and on 2026-09-15 it was found not
         to be applying at all (see _headers), so a returning visitor keeps a
         four-hour-old copy. That is harmless for most changes and was NOT
         harmless for the board-threads deploy: the worker now sends a post's
         pid instead of its code, and the previous deetsmusic.js looks for a
         code, so its up-arrow fails. index.html is max-age=0 either way, so a
         stamped URL is one the visitor's cache has never seen and is fetched
         at once. Bump the date when this page's JS or CSS changes, and drop
         the whole scheme once _headers works. -->
    <link rel="stylesheet" href="../styles/chrome.css?v=2026-09-17" />
    <link rel="stylesheet" href="../styles/main.css?v=2026-09-16b" />
    <script src="../js/controls.js?v=2026-09-17" defer></script>
    <script src="../js/account.js" defer></script>
    <script src="../js/toast.js" defer></script>
    <script src="./strings.js?v=2026-09-16b" defer></script>
    <script src="./mock.js?v=2026-09-15" defer></script>
    <script src="./deetsmusic.js?v=2026-09-16b" defer></script>
    <script src="../js/walkers.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <div class="site-brand">
        <a class="wordmark" href="/">Deets</a>
      </div>
      <nav class="site-nav" aria-label="Primary">
        <a href="/deetsmusic/" aria-current="page">DeetsMusic</a>
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">Blog<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/sotd/" role="menuitem" data-nav-core>SOTD</a>
            <a href="/movies/" role="menuitem">Movies</a>
          </div>
        </div>
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">Games<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/cities/" role="menuitem">DeetsCities</a>
            <a href="/mahjong/" role="menuitem">DeetsMahjong</a>
            <a href="/poker/" role="menuitem">DeetsPoker</a>
            <a href="/tanks/" role="menuitem">DeetsTanks</a>
          </div>
        </div>
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">Utilities<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/radio/" role="menuitem">DeetsRadio</a>
            <a href="/league/" role="menuitem">League</a>
          </div>
        </div>
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">About Me<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/cool-stuff/" role="menuitem" data-nav-core>Cool Stuff I Did</a>
            <a href="/resume/" role="menuitem">Resume</a>
          </div>
        </div>
      </nav>
      <span class="settings" data-settings></span>
    </header>

    <!-- DeetsMusic — the Windows app's front door (docs/support.md, "The
         page"). DRAFT: Claude's first-pass layout, Aditya leads the design.
         Every string is filled from strings.js via data-s / data-s-ph;
         the markup holds no copy. ?mock runs it on deetsmusic/mock.js. -->
    <main class="site-main" data-dm>
      <header class="page-bar">
        <h1 class="page-bar__title">DeetsMusic</h1>
        <div class="page-bar__actions">
          <span class="dm-chip" data-tone="mock" data-dm-mock data-s="mockBadge" hidden></span>
          <a class="home__cta" data-dm-cta-download hidden></a>
          <a class="home__cta home__cta--soft" href="#suggest" data-s="ctaSuggest"></a>
          <a class="home__cta home__cta--soft" href="#report" data-s="ctaReport"></a>
        </div>
      </header>

      <div data-dm-home>
        <div class="dm-notice" data-dm-notice role="status" hidden>
          <span class="dm-notice__label" data-s="noticeLabel"></span>
          <span data-dm-notice-text></span>
        </div>

        <div class="dm-grid">
          <!-- Install: the probably-only public download point. The file
               comes straight from R2 through the worker's /update/ route. -->
          <section class="dm-box dm-install" id="install" aria-labelledby="dm-install-name">
            <img class="dm-install__icon" src="../assets/deetsmusic/icon.png" alt="" width="80" height="80" />
            <div class="dm-install__id">
              <h2 class="dm-install__name" id="dm-install-name" data-s="installName"></h2>
              <p class="dm-install__ver" data-dm-install-ver></p>
              <p class="dm-hint" data-s="installNeeds"></p>
            </div>
            <div class="dm-install__actions">
              <a class="home__cta" data-dm-install-btn hidden></a>
              <span class="dm-hint" data-dm-install-size></span>
            </div>
            <!-- Browser warning steps: the visitor's browser only (deetsmusic.js
                 renderBrowserSteps); "Other browsers" shows the rest, and an
                 unknown browser sees all three. -->
            <div class="dm-steps" data-dm-steps>
              <!-- The signed line + its ⓘ, which opens the "why the warning" note. -->
              <div class="dm-steps__head">
                <p data-s="installSigned"></p>
                <button type="button" class="dm-add dm-info" data-dm-why aria-expanded="false" aria-controls="dm-why" data-s-label="installWhyLabel"><svg class="dm-info__icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="3.75" r="1.4" /><path d="M8 7.25v6" /></svg></button>
              </div>
              <!-- The note slides open under the ⓘ: the boards' .dm-collapse. -->
              <div class="dm-collapse" id="dm-why" data-dm-why-note inert>
                <div class="dm-collapse__inner">
                  <p class="dm-steps__why" data-s="installWhy"></p>
                </div>
              </div>
              <!-- The text rides an inner span: fillStatic replaces a [data-s] node's
                   whole content, and "Other browsers" is moved to the end of the
                   visitor's own line. -->
              <p class="dm-steps__browser" data-dm-browser="edge"><span data-s="installSteps_edge"></span></p>
              <p class="dm-steps__browser" data-dm-browser="firefox"><span data-s="installSteps_firefox"></span></p>
              <p class="dm-steps__browser" data-dm-browser="chrome"><span data-s="installSteps_chrome"></span></p>
              <button type="button" class="dm-textbtn" data-dm-other-browsers data-s="installOtherBrowsers" hidden></button>
            </div>
          </section>

          <!-- Status: measured by the worker's cron, never typed. -->
          <section class="dm-box dm-status" id="status" aria-labelledby="dm-status-title">
            <h2 class="dm-box__title" id="dm-status-title" data-s="statusTitle"></h2>
            <!-- One row per checked service; data-dm-status-row is its app id in the
                 worker's apps table. The Gatekeeper probes music-api /health (the token
                 mint); the installer probes /update/deetsmusic/health. -->
            <div class="dm-status__row" data-dm-status-row="deetsmusic">
              <div class="dm-status__now">
                <span class="dm-dot" data-dm-status-dot data-state="unknown" aria-hidden="true"></span>
                <span class="dm-status__subject" data-s="statusSubject"></span>
                <span class="dm-status__word" data-dm-status-word></span>
              </div>
              <p class="dm-lead" data-dm-status-line hidden></p>
              <div class="dm-strip" data-dm-strip aria-hidden="true" hidden></div>
              <div class="dm-strip__legend" data-dm-strip-legend aria-hidden="true" hidden>
                <span data-s="stripOld"></span><span data-s="stripNow"></span>
              </div>
            </div>
            <div class="dm-status__row" data-dm-status-row="deetsmusic-installer">
              <div class="dm-status__now">
                <span class="dm-dot" data-dm-status-dot data-state="unknown" aria-hidden="true"></span>
                <span class="dm-status__subject" data-s="statusSubject_installer"></span>
                <span class="dm-status__word" data-dm-status-word></span>
              </div>
              <p class="dm-lead" data-dm-status-line hidden></p>
              <div class="dm-strip" data-dm-strip aria-hidden="true" hidden></div>
              <div class="dm-strip__legend" data-dm-strip-legend aria-hidden="true" hidden>
                <span data-s="stripOld"></span><span data-s="stripNow"></span>
              </div>
            </div>
          </section>

          <!-- Release notes: the whole history, withdrawn rows included — the
               newest as a spotlight, the rest folded by series (deetsmusic.js
               renderReleases). -->
          <section class="dm-box dm-box--wide" id="releases" aria-labelledby="dm-releases-title">
            <div class="dm-box__head">
              <h2 class="dm-box__title" id="dm-releases-title" data-s="releasesTitle"></h2>
              <p class="dm-lead" data-s="releasesHint"></p>
            </div>
            <div class="dm-rels" data-dm-releases></div>
          </section>

          <section class="dm-box dm-board" id="suggestions" data-dm-board="suggestion" aria-labelledby="dm-suggest-title">
            <div class="dm-box__head">
              <h2 class="dm-box__title" id="dm-suggest-title" data-s="suggestTitle"></h2>
              <button type="button" class="dm-add" data-dm-open="suggestion" aria-expanded="false" data-s-label="suggestOpen"><span class="dm-add__glyph" aria-hidden="true">+</span></button>
            </div>
            <div class="dm-board__tools" data-dm-tools="suggestion"></div>
            <div class="dm-collapse dm-collapse--ring" data-dm-collapse="suggestion" inert>
            <div class="dm-collapse__inner">
            <form class="dm-form" data-dm-form="suggestion" novalidate>
              <label class="dm-field">
                <span class="dm-field__label" data-s="formTitleLabel"></span>
                <input class="dm-field__input" name="title" type="text" maxlength="120" autocomplete="off" data-s-ph="formTitleSuggestPh" />
              </label>
              <label class="dm-field">
                <span class="dm-field__label" data-s="formBodyLabel"></span>
                <textarea class="dm-field__input dm-field__area" name="body" maxlength="4000" rows="5" data-s-ph="formBodySuggestPh"></textarea>
                <span class="dm-field__count" data-dm-count></span>
              </label>
              <p class="dm-form__err" data-dm-err role="alert" hidden></p>
              <div class="dm-form__actions">
                <button type="submit" class="home__cta" data-dm-send data-s="formSend"></button>
                <button type="button" class="home__cta home__cta--soft" data-dm-cancel data-s="formCancel"></button>
              </div>
            </form>
            </div>
            </div>
            <div class="dm-posts" data-dm-list="suggestion"></div>
          </section>

          <section class="dm-box dm-board" id="issues" data-dm-board="issue" aria-labelledby="dm-issues-title">
            <div class="dm-box__head">
              <h2 class="dm-box__title" id="dm-issues-title" data-s="issuesTitle"></h2>
              <button type="button" class="dm-add" data-dm-open="issue" aria-expanded="false" data-s-label="issuesOpen"><span class="dm-add__glyph" aria-hidden="true">+</span></button>
            </div>
            <div class="dm-board__tools" data-dm-tools="issue"></div>
            <div class="dm-collapse dm-collapse--ring" data-dm-collapse="issue" inert>
            <div class="dm-collapse__inner">
            <form class="dm-form" data-dm-form="issue" novalidate>
              <label class="dm-field">
                <span class="dm-field__label" data-s="formTitleLabel"></span>
                <input class="dm-field__input" name="title" type="text" maxlength="120" autocomplete="off" data-s-ph="formTitleIssuePh" />
              </label>
              <label class="dm-field">
                <span class="dm-field__label" data-s="formBodyLabel"></span>
                <textarea class="dm-field__input dm-field__area" name="body" maxlength="4000" rows="6" data-s-ph="formBodyIssuePh"></textarea>
                <span class="dm-field__count" data-dm-count></span>
              </label>
              <!-- Version: a tb- pill + popover, "All" plus every version the updater serves. -->
              <div class="dm-field">
                <span class="dm-field__label" id="dm-version-label" data-s="formVersionLabel"></span>
                <div class="tb-ctrl dm-version" data-dm-version>
                  <button type="button" class="tb-pill" aria-haspopup="true" aria-expanded="false" aria-labelledby="dm-version-label dm-version-value">
                    <span class="tb-pill__value" id="dm-version-value"></span><span class="tb-pill__caret" aria-hidden="true">▾</span>
                  </button>
                  <div class="tb-pop dm-version__pop" role="menu" hidden></div>
                </div>
              </div>
              <p class="dm-form__err" data-dm-err role="alert" hidden></p>
              <div class="dm-form__actions">
                <button type="submit" class="home__cta" data-dm-send data-s="formSend"></button>
                <button type="button" class="home__cta home__cta--soft" data-dm-cancel data-s="formCancel"></button>
              </div>
            </form>
            </div>
            </div>
            <div class="dm-posts" data-dm-list="issue"></div>
          </section>

          <!-- Your posts: the codes this browser sent or opened. -->
          <section class="dm-box dm-box--wide" data-dm-mine aria-labelledby="dm-mine-title" hidden>
            <div class="dm-box__head">
              <h2 class="dm-box__title" id="dm-mine-title" data-s="mineTitle"></h2>
            </div>
            <ul class="dm-mine__list" data-dm-mine-list></ul>
            <p class="dm-hint" data-s="mineLead"></p>
          </section>

          <footer class="dm-box dm-box--wide dm-fine" aria-labelledby="dm-fine-title">
            <h2 class="dm-box__title" id="dm-fine-title" data-s="fineTitle"></h2>
            <p data-s="privacy1"></p>
            <p data-s="privacy2"></p>
            <p data-s="trademark"></p>
          </footer>
        </div>
      </div>

      <!-- One ticket, opened by its code in the fragment (#t=<code>). -->
      <div class="dm-ticket" data-dm-ticket hidden>
        <a class="dm-link dm-back" href="#" data-s="ticketBack"></a>
        <section class="dm-box" data-dm-ticket-body aria-live="polite"></section>
        <section class="dm-box" data-dm-thread aria-labelledby="dm-replies-title" hidden>
          <h2 class="dm-box__title" id="dm-replies-title" data-s="repliesTitle"></h2>
          <ol class="dm-replies" data-dm-replies></ol>
          <!-- Signed out on a public thread (#p=): the box is replaced by the
               door to it. Never shown on #t=, which needs no account. -->
          <div class="dm-signin" data-dm-signin hidden>
            <p class="dm-hint" data-s="commentSignin"></p>
            <button type="button" class="home__cta home__cta--soft" data-dm-signin-go data-s="commentSigninGo"></button>
          </div>
          <form class="dm-form" data-dm-reply novalidate>
            <label class="dm-field">
              <span class="dm-field__label" data-dm-reply-label></span>
              <textarea class="dm-field__input dm-field__area" name="body" maxlength="4000" rows="4"></textarea>
            </label>
            <p class="dm-form__err" data-dm-err role="alert" hidden></p>
            <!-- A poll rides the comment (support.md, "Polls"): the comment's
                 body is the question, and one Send sends both. So its button
                 stands beside Send, and the editor drops down under the pair.
                 Public threads only — #t= has no account behind it to hang a
                 ballot on. The rows are built in deetsmusic.js. -->
            <div class="dm-form__actions">
              <button type="submit" class="home__cta" data-dm-send></button>
              <button type="button" class="home__cta home__cta--soft dm-pollform" data-dm-pollform data-dm-poll-open aria-expanded="false" hidden></button>
            </div>
            <div class="dm-collapse dm-collapse--ring" data-dm-poll-collapse>
              <div class="dm-collapse__inner">
                <div class="dm-polledit">
                  <div class="dm-polledit__rows" data-dm-poll-rows></div>
                  <div class="dm-polledit__foot">
                    <button type="button" class="dm-textbtn" data-dm-poll-addrow data-s="pollAddOption"></button>
                    <div class="dm-pollmode" data-dm-poll-mode role="group">
                      <span class="dm-field__label" data-s="pollModeLabel"></span>
                      <button type="button" class="dm-pollmode__opt" data-dm-poll-multi="0" aria-pressed="true" data-s="pollModeOne"></button>
                      <button type="button" class="dm-pollmode__opt" data-dm-poll-multi="1" aria-pressed="false" data-s="pollModeMany"></button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
