    <script>
      (function () {
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          /* Retired ids → successor, both axes. Mirrors RETIRED in controls.js. */
          var R = { desk: "press", fairy: "lilac", glade: "green",
                    hornet: "black-yellow", viper: "black-red",
                    cyberstorm: "cyber", "retro-future": "cyber" };
          var t = localStorage.getItem("deets-theme");
          if (!t) { t = dark ? "moonlight" : "lilac"; }
          document.documentElement.setAttribute("data-theme", R[t] || t);
          var s = localStorage.getItem("deets-skin");
          if (!s) { s = dark ? "ocean" : "glass"; }
          document.documentElement.setAttribute("data-skin", R[s] || s);
        } catch (e) {}
      })();
    </script>

    <!-- The DeetsMusic web demo (DeetsMusic repo: docs/features/WEB-DEMO.md). The real
         app's UI, built by `npm run demo:build` in the DeetsMusic repo and copied to app/,
         runs in the frame below with the owner's Songs of the Day (/sotd/songs.json). The frame follows the app's own window
         size: a surface change in the app resizes it. Every string comes from strings.js. -->
    <main class="site-main" data-dmd>
      <header class="page-bar">
        <h1 class="page-bar__title" data-s="title"></h1>
        <div class="page-bar__actions">
          <a class="home__cta" href="/deetsmusic/" data-s="appPage"></a>
          <a class="home__cta home__cta--soft" href="https://github.com/deets-137/DeetsMusicWindows" target="_blank" rel="noopener" data-s="github"></a>
        </div>
      </header>

      <p class="dmd-lede" data-s="lede"></p>
      <p class="dmd-lede" data-s="ledeSignIn"></p>

      <!-- The app's own first-run walk and its New badges guide a visitor; Start over
           resets the demo, and with it the walk. Below it, two quick clusters (demo.js):
           the Looks set the app's theme and skin in one go, the Surfaces its window. The
           lit button in each is what the app shows now. -->
      <div class="dmd-bar">
        <button type="button" class="home__cta home__cta--soft" data-dmd-reset data-s="reset"></button>
      </div>
      <div class="dmd-bar dmd-quick">
        <div class="dmd-cluster">
          <button type="button" class="home__cta home__cta--soft" data-dmd-look="lilac glass" aria-pressed="false" data-s="look1"></button>
          <button type="button" class="home__cta home__cta--soft" data-dmd-look="moonlight ocean" aria-pressed="false" data-s="look2"></button>
          <button type="button" class="home__cta home__cta--soft" data-dmd-look="sepia press" aria-pressed="false" data-s="look3"></button>
          <button type="button" class="home__cta home__cta--soft" data-dmd-look="black-red cyber" aria-pressed="false" data-s="look4"></button>
        </div>
        <span class="dmd-sep" aria-hidden="true" data-s="quickSep"></span>
        <div class="dmd-cluster">
          <button type="button" class="home__cta home__cta--soft" data-dmd-surface="mini player" aria-pressed="false" data-s="surfacePlayer"></button>
          <button type="button" class="home__cta home__cta--soft" data-dmd-surface="mini cards" aria-pressed="false" data-s="surfaceMini"></button>
          <button type="button" class="home__cta home__cta--soft" data-dmd-surface="midi" aria-pressed="false" data-s="surfaceMidi"></button>
          <button type="button" class="home__cta home__cta--soft" data-dmd-surface="max" aria-pressed="false" data-s="surfaceMax"></button>
        </div>
      </div>

      <!-- The songs are the owner's Songs of the Day, and a song plays Apple's 30-second
           preview. Apple lets a preview play only next to a store link, so the panel beside
           the frame holds Apple's own badge for the song in the app (demo.js "nowplaying").
           It wraps below the frame when the page is too narrow for both. -->
      <div class="dmd-stage" data-dmd-stage>
        <div class="dm-box dmd-frame" data-dmd-frame>
          <iframe class="dmd-app" data-dmd-app src="./app/index.html" data-s-title="frameTitle" allow="autoplay"></iframe>
        </div>
        <aside class="dm-box dmd-listen" data-dmd-listen hidden>
          <a class="dmd-listen__badge" data-dmd-listen-link href="https://music.apple.com/" target="_blank" rel="noopener">
            <img src="./listen-on-apple-music.svg" width="140" height="41" data-s-alt="listenBadge" alt="" />
          </a>
          <p class="dmd-listen__title" data-dmd-listen-title></p>
          <p class="dmd-listen__meta" data-dmd-listen-artist></p>
          <p class="dmd-listen__meta" data-dmd-listen-album></p>
        </aside>
      </div>
    </main>
