<!doctype html>
<html lang="en" data-theme="lilac" data-skin="cyber">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeetsMusic admin — Deets</title>
    <!-- The owner's page (DeetsSolutions docs/support.md, "The admin page"). The worker
         answers its data only to the owner; a search engine has nothing to index here. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="../../assets/favicon.png" type="image/png" />
    <script>
      (function () {
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          /* Retired ids → successor, both axes. Mirrors RETIRED in controls.js. */
          var R = { desk: "press", fairy: "lilac", glade: "green",
                    hornet: "black-yellow", viper: "black-red",
                    cyberstorm: "cyber", "retro-future": "cyber" };
          var t = localStorage.getItem("deets-theme");
          if (!t) { t = dark ? "black-red" : "lilac"; }
          document.documentElement.setAttribute("data-theme", R[t] || t);
          var s = localStorage.getItem("deets-skin");
          if (!s) { s = dark ? "ocean" : "press"; }
          document.documentElement.setAttribute("data-skin", R[s] || s);
        } catch (e) {}
      })();
    </script>
    <!-- ?v= stamps: bump when this page's JS or CSS changes (docs/architecture.md, "Local dev & deploy"). -->
    <link rel="stylesheet" href="../../styles/chrome.css?v=2026-10-28" />
    <!-- chrome.css's token imports, fetched beside it rather than after it -->
    <link rel="preload" href="../../styles/fonts.css?v=2026-09-17" as="style" />
    <link rel="preload" href="../../styles/palette.css?v=2026-10-23" as="style" />
    <link rel="preload" href="../../styles/themes.css?v=2026-10-23" as="style" />
    <link rel="preload" href="../../styles/skin.css?v=2026-10-28" as="style" />
    <link rel="stylesheet" href="../../styles/main.css?v=2026-10-30" />
    <script src="../../js/controls.js?v=2026-10-24" defer></script>
    <script src="../../js/account.js" defer></script>
    <script src="../../js/toast.js" defer></script>
    <script src="../strings.js?v=2026-10-30" defer></script>
    <script src="../mock.js?v=2026-10-30" defer></script>
    <!-- Generated from DeetsMusic: scripts/build-usage-settings.mjs (support.md, "The dashboard"). -->
    <script src="./usage-settings.js?v=2026-10-27c" defer></script>
    <script src="./admin.js?v=2026-10-30" defer></script>
  </head>

  <body>
    <header class="site-header">
      <div class="site-brand">
        <a class="wordmark" href="/">Deets</a>
      </div>
      <nav class="site-nav" aria-label="Primary">
        <div class="nav-group">
          <a class="nav-group__label" href="/deetsmusic/" aria-haspopup="true">DeetsMusic<span class="nav-group__caret" aria-hidden="true">&#9662;</span></a>
          <div class="nav-group__menu" role="menu">
            <a href="/deetsmusic/" role="menuitem">App</a>
            <a href="/deetsmusic/demo/" role="menuitem">Demo</a>
          </div>
        </div>
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">Blog<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/sotd/" role="menuitem" data-nav-core>SOTD</a>
            <a href="/movies/" role="menuitem">Movies</a>
          </div>
        </div>
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">Games<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/cities/" role="menuitem">DeetsCities</a>
            <a href="/mahjong/" role="menuitem">DeetsMahjong</a>
            <a href="/poker/" role="menuitem">DeetsPoker</a>
          </div>
        </div>
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">Utilities<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/radio/" role="menuitem" data-nav-desktop>DeetsRadio</a>
            <a href="/league/" role="menuitem" data-nav-desktop>League</a>
          </div>
        </div>
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">About Me<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/cool-stuff/" role="menuitem" data-nav-core>Cool Stuff I Did</a>
            <a href="/resume/" role="menuitem">Resume</a>
          </div>
        </div>
      </nav>
      <span class="settings" data-settings></span>
    </header>

    <main class="site-main" data-dm-admin>
      <header class="page-bar">
        <h1 class="page-bar__title" data-s="adminTitle"></h1>
        <div class="page-bar__actions">
          <span class="dm-chip" data-tone="mock" data-dm-mock data-s="mockBadge" hidden></span>
        </div>
      </header>

      <!-- Who you are: the worker's call (GET /admin/me), never this page's. -->
      <p class="dm-lead dm-admin__gate" data-dm-admin-gate data-s="adminChecking"></p>

      <!-- The dashboard (support.md, "The dashboard"): an overview always on top, then four
           tabs. Everything is drawn from GET /admin/usage and the Inbox reads; counts only. -->
      <div class="dm-grid dm-usage" data-dm-usage hidden>
        <!-- Overview: the Channel and Week pills, the flags, the headline tiles. -->
        <section class="dm-box dm-box--wide dm-dash" aria-labelledby="dm-dash-title">
          <div class="dm-box__head">
            <h2 class="dm-box__title" id="dm-dash-title" data-s="dashOverview"></h2>
            <div class="dm-board__tools" data-dm-usage-tools></div>
          </div>
          <p class="dm-lead" data-dm-usage-state></p>
          <div class="dm-dash__flags" data-dm-flags></div>
          <div class="dm-dash__tiles" data-dm-tiles></div>
        </section>

        <div class="dm-dash__tabs" role="tablist" data-dm-tabs>
          <button type="button" role="tab" class="dm-dash__tab" id="dm-tab-growth" aria-controls="growth" data-tab="growth" data-s="dashTab_growth"></button>
          <button type="button" role="tab" class="dm-dash__tab" id="dm-tab-inbox" aria-controls="inbox" data-tab="inbox" data-s="inboxTitle"></button>
          <button type="button" role="tab" class="dm-dash__tab" id="dm-tab-releases" aria-controls="releases" data-tab="releases" data-s="dashTab_releases"></button>
          <button type="button" role="tab" class="dm-dash__tab" id="dm-tab-settings" aria-controls="settings" data-tab="settings" data-s="dashTab_settings"></button>
          <button type="button" role="tab" class="dm-dash__tab" id="dm-tab-history" aria-controls="history" data-tab="history" data-s="dashTab_history"></button>
        </div>

        <!-- Growth: active installs by version, the version mix, the download funnel. -->
        <section class="dm-box dm-box--wide dm-dash__panel" id="growth" role="tabpanel" aria-labelledby="dm-tab-growth" data-panel="growth" hidden>
          <div class="dm-usage__body">
            <h3 class="dm-usage__sub" data-s="usageDaily"></h3>
            <div class="dm-usage__chart" data-dm-usage-daily></div>
            <h3 class="dm-usage__sub" data-s="usageVersions"></h3>
            <div class="dm-usage__bars" data-dm-usage-versions></div>
            <p class="dm-hint" data-dm-usage-lag data-s="usageVersionsLag" hidden></p>
            <h3 class="dm-usage__sub" data-s="usageInstalls"></h3>
            <p class="dm-hint" data-dm-usage-installslead></p>
            <div class="dm-dash__funnel" data-dm-funnel></div>
            <div class="dm-usage__chart" data-dm-installs-chart></div>
            <details class="dm-dash__table">
              <summary data-s="dashTable"></summary>
              <div class="dm-usage__table" data-dm-usage-installs></div>
            </details>
          </div>
        </section>

        <!-- Inbox (support.md, "The Inbox"): a summary, then every post, newest activity first,
             with its thread, a reply box and the status. GET /admin/posts, then GET /t/<code>
             per post; no route of its own, so the worker did not change for it. -->
        <section class="dm-box dm-box--wide dm-inbox dm-dash__panel" id="inbox" role="tabpanel" aria-labelledby="dm-tab-inbox" data-panel="inbox" data-dm-inbox hidden>
          <div class="dm-dash__tiles dm-dash__tiles--three" data-dm-inbox-tiles></div>
          <div class="dm-dash__pair">
            <div>
              <h3 class="dm-usage__sub" data-s="dashPostsWeekly"></h3>
              <div class="dm-usage__chart" data-dm-inbox-weekly></div>
            </div>
            <div>
              <h3 class="dm-usage__sub" data-s="dashBugsByVersion"></h3>
              <div class="dm-usage__bars" data-dm-inbox-versions></div>
            </div>
          </div>
          <div class="dm-box__head">
            <h3 class="dm-usage__sub" data-s="dashPosts"></h3>
            <div class="dm-board__tools" data-dm-inbox-tools></div>
          </div>
          <p class="dm-lead" data-dm-inbox-state></p>
          <div class="dm-inbox__list" data-dm-inbox-list></div>
        </section>

        <!-- Releases: one card per version with update counts, then health. -->
        <section class="dm-box dm-box--wide dm-dash__panel" id="releases" role="tabpanel" aria-labelledby="dm-tab-releases" data-panel="releases" hidden>
          <div class="dm-usage__body">
            <h3 class="dm-usage__sub" data-s="usageUpdates"></h3>
            <p class="dm-hint" data-s="usageUpdatesLead"></p>
            <div class="dm-dash__releases" data-dm-releases></div>
            <h3 class="dm-usage__sub" data-s="usageHealth"></h3>
            <p class="dm-hint" data-dm-usage-healthlead></p>
            <div class="dm-usage__table" data-dm-heat></div>
            <div class="dm-usage__subhead">
              <h3 class="dm-usage__sub" data-s="dashApple"></h3>
              <div class="dm-board__tools" data-dm-usage-healthtool></div>
            </div>
            <p class="dm-hint" data-s="dashAppleLead"></p>
            <div class="dm-usage__table" data-dm-apple></div>
            <details class="dm-dash__table">
              <summary data-s="dashTable"></summary>
              <div class="dm-usage__table" data-dm-usage-updates></div>
              <div class="dm-usage__table" data-dm-usage-health></div>
            </details>
          </div>
        </section>

        <!-- Settings: every setting at once, then the cross-check. -->
        <section class="dm-box dm-box--wide dm-dash__panel" id="settings" role="tabpanel" aria-labelledby="dm-tab-settings" data-panel="settings" hidden>
          <div class="dm-usage__body">
            <h3 class="dm-usage__sub" data-s="usageSettings"></h3>
            <p class="dm-hint" data-dm-shares-lead></p>
            <div class="dm-dash__shares" data-dm-usage-shares></div>
            <div class="dm-usage__subhead">
              <h3 class="dm-usage__sub" data-s="usageCross"></h3>
              <div class="dm-board__tools" data-dm-usage-crosstools></div>
            </div>
            <p class="dm-hint" data-s="usageCrossLead"></p>
            <div class="dm-usage__table" data-dm-usage-cross></div>
          </div>
        </section>

        <!-- History (support.md, "The archive" › History): posts filed per month, the deleted
             ones included, then every deleted post. GET /admin/history and /admin/archive.
             A first draft; he designs it, and the forum page (support.md, "The forum page")
             may take it over. -->
        <section class="dm-box dm-box--wide dm-inbox dm-dash__panel" id="history" role="tabpanel" aria-labelledby="dm-tab-history" data-panel="history" data-dm-history hidden>
          <div class="dm-dash__tiles dm-dash__tiles--three" data-dm-history-tiles></div>
          <div>
            <h3 class="dm-usage__sub" data-s="historyMonthsTitle"></h3>
            <p class="dm-hint" data-s="historyMonthsLead"></p>
            <div class="dm-usage__chart" data-dm-history-chart></div>
            <details class="dm-dash__table">
              <summary data-s="dashTable"></summary>
              <div class="dm-usage__table" data-dm-history-months></div>
            </details>
          </div>
          <div class="dm-box__head">
            <h3 class="dm-usage__sub" data-s="historyArchiveTitle"></h3>
          </div>
          <p class="dm-hint" data-s="historyArchiveLead"></p>
          <div class="dm-inbox__list" data-dm-history-archive></div>
        </section>
      </div>
    </main>
  </body>
</html>
