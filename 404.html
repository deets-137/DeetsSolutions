    <!-- Cloudflare Pages serves this, with a 404 status, for any path with no
         file behind it (before it existed, every such path got the home page
         with a 200, robots.txt included). It answers at any depth, so every
         URL here is absolute. -->
    <title>Not found — Deets.Solutions</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <script>
      (function () {
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          /* Retired ids → successor, both axes. Mirrors RETIRED in controls.js. */
          var R = { desk: "press", fairy: "lilac", glade: "green",
                    hornet: "black-yellow", viper: "black-red",
                    cyberstorm: "cyber", "retro-future": "cyber",
                    vanilla: "press", glass: "ocean", metal: "cyber" };
          var t = localStorage.getItem("deets-theme");
          if (!t) { t = dark ? "black-red" : "lilac"; }
          document.documentElement.setAttribute("data-theme", R[t] || t);
          var s = localStorage.getItem("deets-skin");
          if (!s) { s = dark ? "ocean" : "press"; }
          document.documentElement.setAttribute("data-skin", R[s] || s);
        } catch (e) {}
      })();
    </script>
        <!-- The page-transition opt-in, inline so it arrives with the HTML: a rule in a stylesheet can still be loading when the browser checks for it (chrome.css, "The wide layout"). -->
