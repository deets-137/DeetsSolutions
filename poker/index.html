<!doctype html>
<html lang="en" data-theme="lilac" data-skin="retro-future">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeetsPoker — Deets</title>
    <link rel="icon" href="../assets/favicon.png" type="image/png" />
    <script>
      (function () {
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          /* Retired ids → successor, both axes. Mirrors RETIRED in controls.js. */
          var R = { desk: "press", fairy: "lilac", glade: "green",
                    hornet: "black-yellow", viper: "black-red",
                    cyberstorm: "retro-future" };
          var t = localStorage.getItem("deets-theme");
          if (!t) { t = dark ? "black-red" : "lilac"; }
          document.documentElement.setAttribute("data-theme", R[t] || t);
          var s = localStorage.getItem("deets-skin");
          if (!s) { s = dark ? "retro-future" : "press"; }
          document.documentElement.setAttribute("data-skin", R[s] || s);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="../styles/chrome.css" />
    <link rel="stylesheet" href="../styles/table.css" />
    <link rel="stylesheet" href="./poker.css" />
    <script src="../js/controls.js" defer></script>
    <script src="../js/account.js" defer></script>
    <script src="../js/toast.js" defer></script>
    <script src="./strings.js" defer></script>
    <script src="../games/colors.js" defer></script>
    <script src="./engine.js" defer></script>
    <script src="../games/transport.js" defer></script>
    <script src="../games/table-mock.js" defer></script>
    <script src="./transport-mock.js" defer></script>
    <script src="../games/table.js" defer></script>
    <script src="../games/flights.js" defer></script>
    <script src="./poker.js" defer></script>
    <script src="../js/walkers.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <div class="site-brand">
        <a class="wordmark" href="/">Deets</a>
      </div>
      <nav class="site-nav" aria-label="Primary">
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">Blog<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/sotd/" role="menuitem" data-nav-core>SOTD</a>
            <a href="/movies/" role="menuitem">Movies</a>
          </div>
        </div>
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">Games<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/cities/" role="menuitem">DeetsCities</a>
            <a href="/mahjong/" role="menuitem">DeetsMahjong</a>
            <a href="/poker/" role="menuitem" aria-current="page">DeetsPoker</a>
            <a href="/tanks/" role="menuitem">DeetsTanks</a>
          </div>
        </div>
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">Utilities<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/radio/" role="menuitem">DeetsRadio</a>
            <a href="/league/" role="menuitem">League</a>
          </div>
        </div>
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">About Me<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/cool-stuff/" role="menuitem" data-nav-core>Cool Stuff I Did</a>
            <a href="/resume/" role="menuitem">Resume</a>
          </div>
        </div>
      </nav>
      <span class="settings" data-settings></span>
    </header>

    <main class="site-main">
      <!-- DeetsPoker — no-limit Texas Hold'em, 2–12 seats (docs/poker.md).
           Phase 1: the mock transport (transport-mock.js) runs the real rules
           engine (engine.js) in-page so a full cash game is playable solo;
           the mock is the DEFAULT until the ../DeetsPoker worker lands in
           Phase 2 (?mock stays the explicit switch either way). The bar
           carries the table-code combo box (cities/mahjong idiom): the table
           code IS the title. All flavor copy comes from strings.js. -->
      <section class="pk">
        <div class="sotd__bar">
          <div class="tb-ctrl gt-code">
            <!-- aria-label comes from strings.js (poker.js boot) -->
            <input class="gt-code__input" data-pk-code type="text"
                   autocomplete="off" spellcheck="false" />
            <div class="tb-pop gt-code__pop" data-pk-code-pop hidden></div>
          </div>
          <div class="sotd-toolbar" data-pk-toolbar aria-label="Table controls"></div>
        </div>

        <!-- pre-join gate: peek result → sit / watch / open-this-table -->
        <div class="pk-gate" data-pk-gate hidden></div>

        <!-- the bento — stable across all phases; tiles change contents, not
             places (docs/poker.md, "Page layout — the bento"). Poker folds
             the dice and log slots into one tall players tile: the felt
             carries the action, the roster carries the numbers. -->
        <div class="pk-table" data-pk-table hidden>
          <div class="pk-bento">
            <section class="pk-tile pk-tile--big" data-pk-big aria-label="Table"></section>
            <!-- the roster fills the tile; the log lives in the felt's
                 Log popover (cities' Odds/Resources idiom) -->
            <section class="pk-tile pk-tile--players" data-pk-players aria-label="Players"></section>
            <section class="pk-tile pk-tile--role" data-pk-role aria-label="Your hand"></section>
          </div>
        </div>

        <!-- desktop-only: below the nav breakpoint the game is swapped for a
             one-line note -->
        <p class="pk-desktop-note" data-pk-desktop hidden></p>
      </section>
    </main>
  </body>
</html>
