<!doctype html>
<html lang="en" data-theme="fairy" data-skin="cyberstorm">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeetsShips — Deets</title>
    <link rel="icon" href="../assets/favicon.png" type="image/png" />
    <script>
      (function () {
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var t = localStorage.getItem("deets-theme");
          if (!t) { t = dark ? "viper" : "fairy"; }
          document.documentElement.setAttribute("data-theme", t);
          var s = localStorage.getItem("deets-skin");
          if (!s) { s = dark ? "cyberstorm" : "press"; }
          if (s === "desk") s = "press";   /* retired skin → successor */
          document.documentElement.setAttribute("data-skin", s);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="../styles/chrome.css" />
    <link rel="stylesheet" href="../styles/table.css" />
    <link rel="stylesheet" href="./ships.css" />
    <script src="../js/controls.js" defer></script>
    <script src="../js/account.js" defer></script>
    <script src="../js/toast.js" defer></script>
    <script src="./strings.js" defer></script>
    <script src="../games/colors.js" defer></script>
    <script src="./engine.js" defer></script>
    <script src="../games/transport.js" defer></script>
    <script src="../games/table-mock.js" defer></script>
    <script src="./transport-mock.js" defer></script>
    <script src="../games/table.js" defer></script>
    <script src="./ships.js" defer></script>
    <script src="../js/walkers.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <div class="site-brand">
        <a class="wordmark" href="/">Deets</a>
      </div>
      <nav class="site-nav" aria-label="Primary">
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">Blog<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/sotd/" role="menuitem" data-nav-core>SOTD</a>
            <a href="/movies/" role="menuitem">Movies</a>
          </div>
        </div>
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">Games<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/cities/" role="menuitem">DeetsCities</a>
            <a href="/mahjong/" role="menuitem">DeetsMahjong</a>
            <a href="/ships/" role="menuitem" aria-current="page">DeetsShips</a>
          </div>
        </div>
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">Utilities<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/radio/" role="menuitem">DeetsRadio</a>
            <a href="/league/" role="menuitem">League</a>
          </div>
        </div>
        <div class="nav-group">
          <button type="button" class="nav-group__label" aria-haspopup="true">About Me<span class="nav-group__caret" aria-hidden="true">&#9662;</span></button>
          <div class="nav-group__menu" role="menu">
            <a href="/cool-stuff/" role="menuitem" data-nav-core>Cool Stuff I Did</a>
            <a href="/resume/" role="menuitem">Resume</a>
          </div>
        </div>
      </nav>
      <span class="settings" data-settings></span>
    </header>

    <main class="site-main">
      <!-- DeetsShips — moving-ship Battleship on one shared fogged ocean
           (docs/ships.md). The bento is cities' grid with every slot
           repurposed: dice → the phase banner, players → the readiness
           board, log → the calendar of turns, big → the 20×20 ocean,
           role → the planning surface (ships left, actions right). The
           mock transport (transport-mock.js) runs the real engine
           (engine.js) in-page; ?mock selects it — prod is the default
           (../DeetsShips worker at ships-api.deets.solutions). All copy
           comes from strings.js. -->
      <section class="ships">
        <div class="sotd__bar">
          <div class="tb-ctrl gt-code">
            <!-- aria-label comes from strings.js (ships.js boot) -->
            <input class="gt-code__input" data-ships-code type="text"
                   autocomplete="off" spellcheck="false" />
            <div class="tb-pop gt-code__pop" data-ships-code-pop hidden></div>
          </div>
          <div class="sotd-toolbar" data-ships-toolbar aria-label="Table controls"></div>
        </div>

        <!-- pre-join gate: peek result → sit / watch / open-this-table -->
        <div class="gt-gate" data-ships-gate hidden></div>

        <!-- the bento — stable across all phases; tiles change contents,
             not places (docs/ships.md, "The table layout — the bento") -->
        <div class="ships-table" data-ships-table hidden>
          <div class="ships-bento">
            <section class="ships-tile ships-tile--big" data-ships-big aria-label="Ocean"></section>
            <section class="ships-tile ships-tile--phase" data-ships-phase aria-label="Phase"></section>
            <section class="ships-tile ships-tile--players" data-ships-players aria-label="Players"></section>
            <section class="ships-tile ships-tile--log" data-ships-log aria-label="Turns"></section>
            <section class="ships-tile ships-tile--role" data-ships-role aria-label="Planning"></section>
          </div>
        </div>

        <!-- desktop-only: below the nav breakpoint the game is swapped for a
             one-line note -->
        <p class="ships-desktop-note" data-ships-desktop hidden></p>
      </section>
    </main>
  </body>
</html>
